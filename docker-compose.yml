x-backend: &backend
  build: ./backend
  image: mrmoderator-backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mrmod}:${POSTGRES_PASSWORD:-mrmod}@db:5432/${POSTGRES_DB:-mrmod}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mrmod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrmod}
      POSTGRES_DB: ${POSTGRES_DB:-mrmod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api/v1}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
