# Общие настройки бэкенда. Образ собирает только api — bot и scheduler
# запускаются из него же; иначе три параллельные сборки одного тега
# конфликтуют («image ... already exists»).
x-backend: &backend
  image: mrmoderator-backend
  restart: unless-stopped
  env_file: .env
  volumes:
    - sqlite_data:/app/data
  environment:
    DATABASE_URL: sqlite+aiosqlite:////app/data/mrmod.db
    USE_TEST_DATA: ${USE_TEST_DATA:-false}

services:
  api:
    <<: *backend
    build: ./backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "${API_PORT:-8000}:8000"

  bot:
    <<: *backend
    pull_policy: never
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      api:
        condition: service_healthy

  scheduler:
    <<: *backend
    pull_policy: never
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_USE_API_MOCK: ${VITE_USE_API_MOCK:-false}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  sqlite_data: